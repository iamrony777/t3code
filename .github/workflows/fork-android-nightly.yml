# Fork-specific nightly Android APK on standard GitHub runners. Upstream's
# release.yml cannot run here (org-specific blacksmith runners, missing
# secrets), so the fork builds and signs a production arm64 APK itself. OTA
# (T3CODE_DISABLE_OTA=1) is off: the fork's own EAS project serves JS updates
# for EAS builds, but a self-hosted install must never be adopted by it.
name: Fork Android Nightly

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        name: Compare HEAD to last nightly tag
        run: |
          last_nightly_tag=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse "$last_nightly_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "No changes since $last_nightly_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Resolve nightly version
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: release_meta
        name: Resolve nightly release version
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u -d "${{ github.run_started_at }}" +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

  build_android:
    name: Build Android APK (arm64)
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      # T3 Connect public identifiers (not secrets; see .env.example comments).
      - name: Load T3 Connect public config
        shell: bash
        run: grep -E '^T3CODE_' .env.example >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          T3CODE_DISABLE_OTA: "1"
        run: APP_VARIANT=production EXPO_NO_GIT_STATUS=1 npx expo prebuild --clean --platform android

      # Overwrite the template keystore so every CI APK carries the same
      # signature as existing sideloaded installs (in-place updates).
      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "ANDROID_DEBUG_KEYSTORE_B64 secret is not set." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > apps/mobile/android/app/debug.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          T3CODE_DISABLE_OTA: "1"
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: |
          mkdir -p apk-publish
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "apk-publish/t3code-${{ needs.preflight.outputs.tag }}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apk-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build_android]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
